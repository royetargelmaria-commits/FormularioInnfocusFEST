<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Descubre tu arquetipo de innovación · INNFOCUS</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap');

  :root{
    --navy:#0E2841;
    --teal:#156082;
    --blue:#0F9ED5;
    --magenta:#A02B93;
    --purple:#542D8C;
    --orange:#E97132;
    --bg:#F4F5F7;
    --blob:#E9EBEE;
    --ink:#22303F;
    --muted:#6B7A88;
    --accent: var(--purple);
    --accent-2: var(--magenta);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:'Montserrat',sans-serif;
    background: var(--bg);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow-x:hidden;
  }

  #stage{
    width:100%;
    max-width:460px;
    min-height:100vh;
    position:relative;
    background:#fff;
    overflow:hidden;
    box-shadow:0 0 60px rgba(14,40,65,.06);
  }

  /* ---------- decorative blobs / pill shapes (brand language) ---------- */
  .bg-blob{
    position:absolute; border-radius:50%;
    background:var(--blob);
    z-index:0;
  }
  .bg-blob.b1{width:220px;height:220px; top:-90px; right:-90px;}
  .bg-blob.b2{width:160px;height:160px; bottom:60px; left:-80px;}

  .pill{
    position:absolute;
    border-radius:999px;
    z-index:0;
  }
  .pill-line{
    position:absolute;
    height:1px;
    background:rgba(14,40,65,.08);
    transform-origin:0 0;
    z-index:0;
  }

  #app{
    position:relative; z-index:2;
    padding:26px 24px 34px;
    display:flex; flex-direction:column;
    min-height:100vh;
  }

  .brandbar{
    display:flex; align-items:center; gap:10px;
    margin-bottom:26px;
  }
  .brandbar img{height:40px; width:auto; display:block;}
  .brandbar .btxt{
    font-size:10.5px; font-weight:700; letter-spacing:.08em;
    color:var(--muted); line-height:1.35;
  }

  .eyebrow{
    font-size:11px;
    letter-spacing:.1em;
    color:var(--teal);
    font-weight:700;
    margin:0 0 8px;
  }

  h1{
    font-family:'Montserrat',sans-serif;
    font-weight:800;
    font-size:27px;
    line-height:1.2;
    color:var(--navy);
    margin:0 0 14px;
  }
  h2{
    font-weight:800;
    font-size:20px;
    line-height:1.3;
    color:var(--navy);
    margin:0 0 20px;
  }
  .underline{
    width:56px;height:4px;border-radius:3px;
    background:var(--orange);
    margin:0 0 22px;
  }
  p.lead{
    font-size:14px;
    line-height:1.6;
    color:var(--muted);
    margin:0 0 30px;
  }

  main{flex:1; display:flex; flex-direction:column; justify-content:center;}

  /* ---------- Buttons ---------- */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    width:100%;
    padding:16px 20px;
    border-radius:999px;
    border:none;
    font-family:'Montserrat',sans-serif;
    font-weight:700;
    font-size:14.5px;
    cursor:pointer;
    transition:transform .15s ease, filter .15s ease, box-shadow .15s ease;
    background:linear-gradient(120deg, var(--purple), var(--magenta));
    color:#fff;
    box-shadow:0 10px 22px -8px rgba(84,45,140,.55);
  }
  .btn:active{transform:scale(.97);}
  .btn:hover{filter:brightness(1.06);}
  .btn.ghost{
    background:transparent;
    border:1.5px solid #D7DCE1;
    color:var(--navy);
    font-weight:600;
    box-shadow:none;
  }

  /* ---------- Progress: capsule dots (brand badge language) ---------- */
  .progress-row{
    display:flex;gap:7px;margin-bottom:24px;
  }
  .progress-dot{
    flex:1;height:6px;border-radius:4px;
    background:#E6E9ED;
    overflow:hidden;
  }
  .progress-dot .fill{
    height:100%;width:0;border-radius:4px;
    background:linear-gradient(90deg,var(--teal),var(--blue));
    transition:width .4s ease;
  }
  .progress-dot.done .fill{width:100%;}
  .progress-dot.current .fill{width:55%;}

  .q-tag{
    font-size:11px;font-weight:700;letter-spacing:.08em;
    color:var(--teal);margin-bottom:10px;
  }

  /* ---------- Options ---------- */
  .option{
    width:100%;
    text-align:left;
    padding:16px 18px;
    margin-bottom:12px;
    border-radius:16px;
    border:1.5px solid #E5E9ED;
    background:#fff;
    color:var(--ink);
    font-family:'Montserrat',sans-serif;
    font-size:14px;
    line-height:1.45;
    font-weight:500;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:14px;
    transition:all .18s ease;
  }
  .option:hover{
    border-color:var(--purple);
    box-shadow:0 8px 20px -12px rgba(84,45,140,.4);
    transform:translateY(-1px);
  }
  .option .letter{
    flex:0 0 30px;height:30px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:12.5px;
    background:var(--navy);
    color:#fff;
  }

  /* ---------- Archetype capsule trio (result) ---------- */
  .capsule-row{
    display:flex; gap:10px; align-items:flex-end;
    margin:4px 0 28px;
  }
  .capsule{
    flex:1; text-align:center;
    padding:16px 6px 12px;
    border-radius:20px;
    background:#F3F4F6;
    color:#9AA6B1;
    transition:all .3s ease;
  }
  .capsule .cname{
    font-size:10.5px; font-weight:800; letter-spacing:.04em;
    margin-top:6px;
  }
  .capsule.active{
    background:linear-gradient(160deg, var(--accent), var(--accent-2));
    color:#fff;
    transform:translateY(-6px);
    box-shadow:0 14px 26px -12px rgba(0,0,0,.28);
  }
  .capsule .dot{
    width:14px;height:14px;border-radius:50%;
    background:currentColor;
    margin:0 auto;
    opacity:.85;
  }

  .archetype-name{
    font-size:27px;font-weight:800;letter-spacing:-.01em;
    line-height:1.2;
    margin:4px 0 14px;
    color:var(--navy);
  }
  .archetype-msg{
    font-size:14.5px;line-height:1.6;color:var(--muted);margin:0 0 26px;
  }
  .score-tag{
    font-size:11.5px; font-weight:700; letter-spacing:.06em; color:var(--muted);
    margin-bottom:6px;
  }

  .footer-brand{
    text-align:center;font-size:10.5px;color:#A7B2BC;margin-top:8px;letter-spacing:.04em;
  }

  /* ---------- Camera ---------- */
  #cameraStage{
    position:fixed;inset:0;background:#000;
    display:none;flex-direction:column;align-items:center;justify-content:center;z-index:50;
  }
  #cameraStage.active{display:flex;}
  #video{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;transform:scaleX(-1);}
  #frameOverlay{position:absolute;inset:0;pointer-events:none;}
  .cam-top{
    position:absolute; top:70px; left:0; right:0;
    display:flex; justify-content:center;
    z-index:5; padding:0 30px;
  }
  .cam-controls{
    position:absolute;bottom:96px;left:0;right:0;
    display:flex;flex-direction:column;align-items:center;gap:14px;
    z-index:5; padding:0 26px;
  }
  .cam-close{
    position:absolute;top:18px;right:18px;z-index:6;
    background:rgba(0,0,0,.4);border:none;color:#fff;
    width:38px;height:38px;border-radius:50%;font-size:16px;cursor:pointer;
  }
  .cam-hint{
    color:#fff;font-size:13px;text-align:center;line-height:1.5;
    background:rgba(0,0,0,.5);
    padding:12px 20px;border-radius:16px;
    max-width:300px;
  }
  .cam-hint strong{display:block;font-size:14px;margin-bottom:2px;}
  .cam-finish{ width:100% !important; }

  #camError{
    color:#fff;text-align:center;padding:0 30px;font-size:14px;line-height:1.6;
  }

  .fade-in{animation:fadeIn .35s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
</style>
</head>
<body>

<div id="stage">
  <div class="bg-blob b1"></div>
  <div class="bg-blob b2"></div>
  <div id="app"></div>
</div>

<div id="cameraStage">
  <video id="video" autoplay playsinline muted></video>
  <svg id="frameOverlay" viewBox="0 0 400 700" preserveAspectRatio="none"></svg>
  <button class="cam-close" onclick="closeCamera()">✕</button>
  <div class="cam-top" id="camTop">
    <div class="cam-hint" id="camHint">
      <strong>Encuádrate en el marco</strong>
      Toma una captura de pantalla para guardar tu resultado
    </div>
  </div>
  <div class="cam-controls" id="camControls">
    <button class="btn cam-finish" onclick="closeCamera()">Listo, ya tomé mi captura</button>
  </div>
</div>

    name: "INNOVADOR",
    displayName: "ERES INNOVADOR",
    range: [15,18],
    accent: "#E97132",
    accent2: "#542D8C",
    message: "Tu capacidad para transformar ideas en resultados genera impacto y moviliza el valor de la innovación. ¡Gracias por participar!",
    motif: "spark"
  }
};
const ORDER = ["explorador","visionario","innovador"];

let currentQ = 0;
let score = 0;
let resultKey = null;
let stream = null;

const app = document.getElementById('app');

function setAccent(a,b){
  document.documentElement.style.setProperty('--accent', a);
  document.documentElement.style.setProperty('--accent-2', b);
}

function brandbar(sub){
  return `<div class="brandbar">
    <img src="${LOGO_SRC}" alt="INNFOCUS Ágil">
    <div class="btxt">RUEDA COMERCIAL<br>${sub || 'INNOVACIÓN Y AGILISMO'}</div>
  </div>`;
}

/* ---------------- SCREENS ---------------- */
function renderIntro(){
  setAccent('#542D8C','#A02B93');
  app.innerHTML = `
    <div class="fade-in">
      ${brandbar()}
      <main>
        <p class="eyebrow">DESCUBRE TU PERFIL</p>
        <h1>¿Sabes qué tan cerca estás de la innovación?</h1>
        <div class="underline"></div>
        <p class="lead">Descubre qué perfil de innovador eres: EXPLORADOR, VISIONARIO O INNOVADOR al responder este cuestionario.</p>
        <button class="btn" onclick="startQuiz()">Comenzar</button>
      </main>
      <p class="footer-brand">SEGUROS DEL ESTADO · FORMULARIO ANÓNIMO</p>
    </div>
  `;
}

function startQuiz(){
  currentQ = 0; score = 0;
  renderQuestion();
}

function renderQuestion(){
  const q = QUESTIONS[currentQ];
  let segs = '';
  for(let i=0;i<QUESTIONS.length;i++){
    const cls = i < currentQ ? 'done' : (i===currentQ ? 'current' : '');
    segs += `<div class="progress-dot ${cls}"><div class="fill"></div></div>`;
  }
  let opts = '';
  const letters = ['A','B','C'];
  q.options.forEach((opt,i)=>{
    opts += `<button class="option" onclick="answer(${i+1})">
      <span class="letter">${letters[i]}</span><span>${opt}</span>
    </button>`;
  });

  app.innerHTML = `
    <div class="fade-in">
      ${brandbar('PREGUNTA ' + (currentQ+1) + ' DE ' + QUESTIONS.length)}
      <div class="progress-row">${segs}</div>
      <p class="q-tag">${q.tema.toUpperCase()}</p>
      <h2>${q.prompt}</h2>
      <div>${opts}</div>
    </div>
  `;
}

function answer(points){
  score += points;
  currentQ++;
  if(currentQ < QUESTIONS.length){
    renderQuestion();
  } else {
    computeResult();
  }
}

function computeResult(){
  let key = 'explorador';
  if(score >= ARCHETYPES.innovador.range[0]) key = 'innovador';
  else if(score >= ARCHETYPES.visionario.range[0]) key = 'visionario';
  resultKey = key;
  renderResult();
}

function renderResult(){
  const a = ARCHETYPES[resultKey];
  setAccent(a.accent, a.accent2);

  let capsules = '';
  ORDER.forEach(k=>{
    const arc = ARCHETYPES[k];
    const active = k === resultKey ? 'active' : '';
    capsules += `<div class="capsule ${active}">
      <div class="dot"></div>
      <div class="cname">${arc.name}</div>
    </div>`;
  });

  app.innerHTML = `
    <div class="fade-in">
      ${brandbar('TU RESULTADO')}
      <main>
        <div class="capsule-row">${capsules}</div>
        <div class="archetype-name">${a.displayName}</div>
        <p class="archetype-msg">${a.message}</p>
        <button class="btn" onclick="openCamera()">Conoce tu arquetipo</button>
        <div style="height:10px;"></div>
        <button class="btn ghost" onclick="resetAll()">Reiniciar para el siguiente participante</button>
      </main>
      <p class="footer-brand">"YO IMPULSO LA INNOVACIÓN EN SEGUROS DEL ESTADO"</p>
    </div>
  `;
}

/* ---------------- CAMERA ---------------- */
function resetCameraUI(){
  document.getElementById('camTop').innerHTML = `
    <div class="cam-hint" id="camHint">
      <strong>Encuádrate en el marco</strong>
      Toma una captura de pantalla para guardar tu resultado
    </div>`;
  document.getElementById('camControls').innerHTML = `
    <button class="btn cam-finish" onclick="closeCamera()">Listo, ya tomé mi captura</button>`;
}

async function openCamera(){
  const stage = document.getElementById('cameraStage');
  resetCameraUI();
  stage.classList.add('active');
  drawFrameOverlay();
  try{
    stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}, audio:false});
    document.getElementById('video').srcObject = stream;
  }catch(err){
    document.getElementById('camTop').innerHTML = `
      <div class="cam-hint" id="camError">
        No pudimos acceder a tu cámara. Revisa los permisos del navegador e inténtalo de nuevo.
      </div>`;
    document.getElementById('camControls').innerHTML = `
      <button class="btn cam-finish" onclick="closeCamera()">Cerrar</button>`;
  }
}

function closeCamera(){
  if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; }
  document.getElementById('cameraStage').classList.remove('active');
}

function drawFrameOverlay(){
  const a = ARCHETYPES[resultKey];
  const svg = document.getElementById('frameOverlay');
  let inner = `<rect x="10" y="10" width="380" height="680" rx="28" fill="none" stroke="${a.accent}" stroke-width="6"/>
    <rect x="20" y="20" width="360" height="660" rx="22" fill="none" stroke="#ffffff" stroke-opacity=".5" stroke-width="1.5"/>`;

  if(a.motif === 'trail'){
    for(let i=0;i<6;i++){
      inner += `<circle cx="${40+i*18}" cy="650" r="4" fill="${a.accent2}"/>`;
    }
    inner += `<circle cx="350" cy="60" r="26" fill="none" stroke="${a.accent}" stroke-width="3"/>
      <line x1="350" y1="42" x2="350" y2="78" stroke="${a.accent}" stroke-width="2"/>
      <line x1="332" y1="60" x2="368" y2="60" stroke="${a.accent}" stroke-width="2"/>`;
  } else if(a.motif === 'orbit'){
    inner += `<circle cx="350" cy="60" r="16" fill="none" stroke="${a.accent}" stroke-width="3"/>
      <circle cx="350" cy="60" r="28" fill="none" stroke="${a.accent2}" stroke-width="2" stroke-opacity=".7"/>
      <path d="M30 660 Q 90 610 150 650 T 270 630" fill="none" stroke="${a.accent}" stroke-width="3"/>`;
  } else {
    for(let i=0;i<8;i++){
      const ang = i*Math.PI/4;
      const x2 = 350+Math.cos(ang)*30, y2=60+Math.sin(ang)*30;
      inner += `<line x1="350" y1="60" x2="${x2}" y2="${y2}" stroke="${a.accent}" stroke-width="3"/>`;
    }
    inner += `<circle cx="350" cy="60" r="10" fill="${a.accent2}"/>`;
  }

  inner += `<rect x="10" y="605" width="380" height="85" rx="0" fill="rgba(14,40,65,.55)"/>
    <rect x="30" y="615" width="46" height="4" rx="2" fill="${a.accent}"/>
    <text x="30" y="645" fill="#fff" font-family="Montserrat" font-size="23" font-weight="800">${a.name}</text>
    <text x="30" y="668" fill="#fff" font-family="Montserrat" font-size="12.5">Yo impulso la innovación en Seguros del Estado</text>`;

  svg.innerHTML = inner;
}

function resetAll(){
  renderIntro();
}

renderIntro();
</script>
</body>
</html>
